name: Feature
description: New feature or user story
title: "[Feature] "
labels: ["feat"]
body:
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a <role>, I want <action>, so that <benefit>.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: List of conditions that must be met.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
      description: Affected models, routes, or screens (optional).

